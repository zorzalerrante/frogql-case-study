# Publica el visualizador de `web/` en GitHub Pages.
#
# El sitio se sube tal cual está en el repositorio, sin construir nada: el
# grafo, el motor y las consultas viven versionados en `web/datos/` y
# `web/vendor/`. Publicar toma segundos y no depende de que respondan los
# servidores de OpenStreetMap ni los del curso.
#
# Cuando cambie el grafo, la versión del motor o alguna consulta, hay que
# correr `uv run python web/preparar-web.py` y commitear el resultado.
name: Publicar el visualizador

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una publicación a la vez, sin cortar la que esté corriendo.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: despliegue
        uses: actions/deploy-pages@v4
