-- Cuántos reclamos por ruido tiene la calle de cada local con alcohol.
-- `GROUP BY l, c` agrupa por la identidad de los nodos, así que dos locales
-- que comparten nombre no suman sus reclamos.
-- Es la consulta más cara del conjunto. Contar exige unir cada local con cada
-- reclamo de su calle, y en una avenida con mil reclamos y cien locales eso son
-- cien mil filas antes de agrupar. La consulta 03 responde la versión sin
-- conteo con EXISTS y no paga ese producto.
MATCH (r:Reclamo)-[:EN_CALLE]->(c:Calle)<-[:EN_CALLE]-(l:Lugar)
WHERE r.categoria = 'Ruido'
  AND l.categoria IN ['amenity=bar', 'amenity=pub', 'amenity=nightclub',
                      'amenity=restaurant', 'amenity=fast_food', 'shop=alcohol']
RETURN l.etiqueta AS lugar, l.categoria AS categoria, c.nombre AS calle, c.comuna AS comuna,
       COUNT(r) AS reclamos_en_la_calle
GROUP BY l, c
ORDER BY reclamos_en_la_calle DESC
LIMIT 20
