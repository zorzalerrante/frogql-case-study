[project]
name = "frogql-case-study"
version = "0.1.0"
description = "Redes viales de OpenStreetMap en Independencia exportadas como grafo de propiedades para froGQL"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chiricoca",
    "frogql>=0.5.4",
    "geopandas>=1.0",
    "ipykernel>=6.29",
    "networkx>=3.3",
    "pyarrow>=15",
    "quackosm>=0.17.1",
    "scipy>=1.13",
    "shapely>=2.0",
]

[tool.uv]
package = false

[tool.uv.sources]
chiricoca = { git = "https://github.com/PLUMAS-research/chiricoca.git" }
